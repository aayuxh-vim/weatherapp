apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherapp
spec:
  replicas: 2

  selector:
    matchLabels:
      app: weatherapp

  template:
    metadata:
      labels:
        app: weatherapp

    spec:
      containers:
        - name: weatherapp
          image: aayuxh/weatherapp:latest
          ports:
            - containerPort: 80
