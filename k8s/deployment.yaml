apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-dashboard-deployment
  labels:
    app: weather-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-dashboard
  template:
    metadata:
      labels:
        app: weather-dashboard
    spec:
      containers:
      - name: weather-dashboard
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        imagePullPolicy: Always
